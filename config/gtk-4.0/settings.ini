# Goes to ~/.config/gtk-4.0/settings.ini. See config/gtk-3.0/settings.ini.
#
# libadwaita apps such as Nautilus ignore gtk-theme-name and take their colours
# from gtk.css instead; the name is set for the GTK 4 apps that are not
# libadwaita apps.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=BreezeX-Light
gtk-cursor-theme-size=28
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none

# No gtk-application-prefer-dark-theme here: libadwaita warns about it and reads
# org.gnome.desktop.interface color-scheme instead, which is set to prefer-dark.
