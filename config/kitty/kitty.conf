# kitty reloads this file on SIGUSR1 and, on Linux, when it is written, so
# install.sh does not signal it.

term xterm-256color

# theme:begin kitty-font
font_family      JetBrainsMonoNL NF
font_size        14
# theme:end

bold_font        auto
italic_font      auto
bold_italic_font auto

window_padding_width 2
# theme:begin kitty-opacity
background_opacity 0.9
# theme:end

cursor_shape beam
cursor_blink_interval -1

scrollback_lines 250000

enable_audio_bell no

map f11 toggle_fullscreen
map ctrl+shift+o open_url_with_hints

# The alacritty hint, as a kitten: a source path followed by :line, opened in vim
# at that line, in this window. The kitten's linenum type wants exactly the two
# groups - path and line - so a bare path with no :line needs its own pattern,
# with an empty second group, on ctrl+alt+e.
map ctrl+shift+e kitten hints --type=linenum --linenum-action=self --linenum-pattern '((?:(?:/|\./)?[^():\s]*/)?[^():\s]+\.(?:go|rs|py|c|cpp|h|hpp|js|ts|lua|md|mdx|yaml|yml)):(\d+)' vim +{line} {path}
map ctrl+alt+e kitten hints --type=linenum --linenum-action=self --linenum-pattern '((?:(?:/|\./)?[^():\s]*/)?[^():\s]+\.(?:go|rs|py|c|cpp|h|hpp|js|ts|lua|md|mdx|yaml|yml))()' vim {path}

# Colors, written by scripts/theme.sh

# theme:begin kitty
foreground #ebdbb2
background #282828

cursor #fabd2f
cursor_text_color #ebdbb2

selection_foreground #ebdbb2
selection_background #3c3836

url_color #83a598

active_border_color   #d79921
inactive_border_color #3c3836
bell_border_color     #fb4934

tab_bar_background       #3c3836
active_tab_foreground    #ebdbb2
active_tab_background    #d79921
inactive_tab_foreground  #928374
inactive_tab_background  #3c3836

color0  #282828
color1  #cc241d
color2  #98971a
color3  #d79921
color4  #458588
color5  #b16286
color6  #689d6a
color7  #a89984

color8  #928374
color9  #fb4934
color10 #b8bb26
color11 #fabd2f
