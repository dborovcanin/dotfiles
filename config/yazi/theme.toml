#:schema https://yazi-rs.github.io/schemas/theme.json
#
# The dotfiles palette as a yazi theme. Written by scripts/theme.sh - edit the
# render_yazi block there, not this file.
#
# yazi has no way to be told about a colour change and no X resources to read
# from, so this is copied out by scripts/install.sh and picked up by the next
# yazi that starts; the ones already running keep the colours they opened with.
#
# Everything not named here - the icons, the layout, the file-type globs - is
# left as yazi ships it, and is merged under this on startup.

# theme:begin yazi
[mgr]
cwd = { fg = "#88c0d0" }

# What a search leaves behind.
find_keyword  = { fg = "#8fbcbb", bold = true, italic = true, underline = true }
find_position = { fg = "#b48ead", bg = "reset", bold = true, italic = true }

symlink_target = { fg = "#7b88a1", italic = true }

# The bar down the left of a file that is waiting to be copied, cut or pasted.
# Foreground and background are the same colour on purpose: the marker is a
# solid block, not a glyph.
marker_copied   = { fg = "#a3be8c", bg = "#a3be8c" }
marker_cut      = { fg = "#bf616a", bg = "#bf616a" }
marker_marked   = { fg = "#88c0d0", bg = "#88c0d0" }
marker_selected = { fg = "#8fbcbb", bg = "#8fbcbb" }

# The same four counted in the status bar.
count_copied   = { fg = "#2e3440", bg = "#a3be8c" }
count_cut      = { fg = "#2e3440", bg = "#bf616a" }
count_selected = { fg = "#2e3440", bg = "#8fbcbb" }

border_style = { fg = "#434c5e" }

[tabs]
active   = { fg = "#2e3440", bg = "#88c0d0", bold = true }
inactive = { fg = "#e5e9f0", bg = "#3b4252" }

# The mode badge at the left of the status bar, and the wedge that carries its
# colour into the bar.
[mode]
normal_main = { fg = "#2e3440", bg = "#88c0d0", bold = true }
normal_alt  = { fg = "#88c0d0", bg = "#3b4252" }
select_main = { fg = "#2e3440", bg = "#bf616a", bold = true }
select_alt  = { fg = "#bf616a", bg = "#3b4252" }
unset_main  = { fg = "#2e3440", bg = "#b48ead", bold = true }
unset_alt   = { fg = "#b48ead", bg = "#3b4252" }

[status]
# The permission bits, one colour each, read before they are read.
perm_sep   = { fg = "#7b88a1" }
perm_type  = { fg = "#a3be8c" }
perm_read  = { fg = "#ebcb8b" }
perm_write = { fg = "#bf616a" }
perm_exec  = { fg = "#88c0d0" }
progress_label  = { fg = "#eceff4", bold = true }
progress_normal = { fg = "#a3be8c", bg = "#3b4252" }
progress_error  = { fg = "#2e3440", bg = "#bf616a" }

[which]
border          = { fg = "#88c0d0" }
cand            = { fg = "#88c0d0" }
rest            = { fg = "#7b88a1" }
desc            = { fg = "#eceff4" }
separator_style = { fg = "#7b88a1" }

[confirm]
border  = { fg = "#88c0d0" }
title   = { fg = "#8fbcbb" }
body    = { fg = "#eceff4" }
list    = { fg = "#e5e9f0" }
btn_yes = { fg = "#2e3440", bg = "#bf616a", bold = true }
btn_no  = { fg = "#eceff4" }

[spot]
border   = { fg = "#88c0d0" }
title    = { fg = "#8fbcbb" }
tbl_col  = { fg = "#81a1c1" }
tbl_cell = { fg = "#2e3440", bg = "#8fbcbb" }

[notify]
title_info  = { fg = "#a3be8c" }
title_warn  = { fg = "#ebcb8b" }
title_error = { fg = "#bf616a" }

[pick]
border   = { fg = "#88c0d0" }
active   = { fg = "#8fbcbb", bold = true }
inactive = { fg = "#eceff4" }

[input]
border   = { fg = "#88c0d0" }
title    = { fg = "#8fbcbb" }
value    = { fg = "#eceff4" }
selected = { fg = "#2e3440", bg = "#8fbcbb" }

[cmp]
border   = { fg = "#88c0d0" }
active   = { fg = "#eceff4", bg = "#3b4252", bold = true }
inactive = { fg = "#e5e9f0" }

[tasks]
border  = { fg = "#88c0d0" }
title   = { fg = "#8fbcbb" }
hovered = { fg = "#8fbcbb", bold = true }

[help]
border  = { fg = "#88c0d0" }
chord   = { fg = "#88c0d0" }
action  = { fg = "#eceff4" }
hovered = { fg = "#eceff4", bg = "#3b4252", bold = true }

# A whole list, because naming one rule replaces the lot; these are yazi's own
# rules with this palette in place of its ANSI names.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "#ebcb8b" },
	{ mime = "**/{audio,video}/*", fg = "#b48ead" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#bf616a" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#88c0d0" },
	{ mime = "vfs/{absent,stale}", fg = "#7b88a1" },
	# A link with nothing at the far end, and a file yazi could not stat.
	{ url = "*", is = "orphan", fg = "#2e3440", bg = "#bf616a" },
	{ url = "*", is = "exec", fg = "#a3be8c" },
	{ url = "*", is = "dummy", fg = "#2e3440", bg = "#bf616a" },
	{ url = "*/", is = "dummy", fg = "#2e3440", bg = "#bf616a" },
	{ url = "*/", fg = "#81a1c1" },
]
# theme:end
