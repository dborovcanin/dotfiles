[env]
TERM = "xterm-256color"

[font]
# theme:begin alacritty-font
normal = { family = "JetBrainsMonoNL NF", style = "Regular" }
bold = { family = "JetBrainsMonoNL NF", style = "Bold" }
italic = { family = "JetBrainsMonoNL NF", style = "Italic" }
size = 14
# theme:end

[window]
padding.x = 2
padding.y = 2
# theme:begin alacritty-opacity
opacity = 0.98
# theme:end

[keyboard]
bindings = [
{ key = "F11", action = "ToggleFullscreen" }
]

# Colors, written by scripts/theme.sh

# Default colors
# theme:begin alacritty
[colors.primary]
background = '#2e3440'
foreground = '#eceff4'

[colors.normal]
black   = '#3b4252'
red     = '#bf616a'
green   = '#a3be8c'
yellow  = '#ebcb8b'
blue    = '#81a1c1'
magenta = '#b48ead'
cyan    = '#88c0d0'
white   = '#e5e9f0'

[colors.bright]
black   = '#4c566a'
red     = '#bf616a'
green   = '#a3be8c'
yellow  = '#ebcb8b'
blue    = '#81a1c1'
magenta = '#b48ead'
cyan    = '#8fbcbb'
white   = '#eceff4'
# theme:end

[[hints.enabled]]

# file path optionally followed by :line[:col] or #Lline[-Lend]
regex = "((?:(?:/|\\./)?[^():\\s]*/)?[^():\\s]+\\.(?:go|rs|py|c|cpp|h|hpp|js|ts|lua|md|mdx|yaml|yml)(?:(?::[0-9]+(?::[0-9]+)?)|(?:#L[0-9]+(?:-L[0-9]+)?))?)"

post_processing = true
persist = false

binding = { key = "E", mods = "Control|Shift" }
mouse = { enabled = true, mods = "Control" }

command = { program = "bash", args = [
  "-lc",
  '''
t="$1"

# trim leading/trailing whitespace (handles tabs from `git status`)
t="${t#"${t%%[![:space:]]*}"}"
t="${t%"${t##*[![:space:]]}"}"

# strip punctuation often surrounding paths
t="${t#(}"; t="${t%)}"
t="${t#,}"; t="${t%.}"

# normalize GitHub range + anchor:
#   file#L123-L140 -> file#L123
t="${t%%-L*}"
#   file#L123 -> file:123
t="${t//#L/:}"

file="$t"
line="1"

# If we have file:line or file:line:col, extract line (drop col)
if [[ "$t" =~ ^(.+):([0-9]+)(:([0-9]+))?$ ]]; then
  file="${BASH_REMATCH[1]}"
  line="${BASH_REMATCH[2]}"
fi

exec alacritty -e vim +"$line" "$file"
''',
  "bash"
] }
