# Lock screen for Hyprland, in place of swaylock. Read from the clone:
# hyprland.conf, hypridle.conf and scripts/power.sh all start hyprlock with -c
# pointing here, so a theme change lands without install.sh copying anything.
#
# The picture is the blurred wallpaper scripts/background.sh renders, which is
# what swaylock shows under sway and niri, so the three look alike.
#
# scripts/travel_lock.sh does not use this file. It writes a copy beside it with
# the background swapped for `path = screenshot`, because a travel lock is meant
# to hide what is on the screen rather than show the wallpaper.
#
# Colours are written by scripts/theme.sh between the theme markers.

$font = DejaVu Sans Mono

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/dusan/dotfiles/themes/bg-blur.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    rounding = 5
    dots_spacing = 0.3
    fade_on_empty = false

    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL

    # theme:begin hyprlock-input
    inner_color = rgb(3c3836)
    outer_color = rgb(d79921)
    check_color = rgb(83a598)
    fail_color = rgb(fb4934)
    font_color = rgb(ebdbb2)
    # theme:end

    position = 0, -80
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    # theme:begin hyprlock-clock
    color = rgb(ebdbb2)
    # theme:end

    position = 0, 60
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $font
    # theme:begin hyprlock-date
    color = rgb(928374)
    # theme:end

    position = 0, -10
    halign = center
    valign = center
}
