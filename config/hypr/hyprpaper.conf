# Wallpaper for Hyprland. Read from the clone: hyprland.lua starts hyprpaper
# with -c pointing here, the way dunst and dbar are started, so that a theme
# change is picked up without install.sh copying anything out.
#
# scripts/background.sh writes themes/bg.jpg and reloads what is drawing it.
# The path is spelled out because hyprpaper does no shell expansion.

ipc = on
splash = false

# An empty monitor makes this the wallpaper for every output.
wallpaper {
    monitor =
    path = /home/dusan/dotfiles/themes/bg.jpg
    fit_mode = cover
}
