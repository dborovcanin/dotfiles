# Hyprland config, ported from config/sway/config.
# https://wiki.hypr.land/Configuring/
#
# Hyprland tiles the way sway does, so this is a closer port than the niri one:
# binding modes become submaps, sticky becomes pin, the scratchpad becomes a
# special workspace and urgent focus is a dispatcher. What has no equivalent is
# noted inline - focus parent, per-window split direction, and gaps changed by a
# step rather than to a preset.
#
# Colours are written by scripts/theme.sh between the theme markers.
#
# $dotfiles is spelled out rather than built from $HOME because Hyprland
# substitutes its own variables before a shell ever sees the line.

$mod = SUPER
$dotfiles = /home/dusan/dotfiles

# The wallpaper and the lock screen are each configured in their own file beside
# this one - hyprpaper.conf and hyprlock.conf - and both name the pictures
# scripts/background.sh renders.

# --- Environment -----------------------------------------------------------

env = GTK2_RC_FILES,/home/dusan/.gtkrc-2.0
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,gtk3
env = XCURSOR_THEME,BreezeX-Light
env = XCURSOR_SIZE,28

# --- Monitors --------------------------------------------------------------
#
# Hyprland has no per-output background; hyprpaper draws it, started from the
# startup section below with its own file in the clone.

monitor = eDP-1,1920x1200,0x0,1
monitor = DP-1,preferred,1920x0,1,transform,0
monitor = HDMI-A-1,preferred,1920x0,1

# --- Input -----------------------------------------------------------------

input {
    kb_layout = us,rs,rs
    kb_variant = ,latin,
    kb_options = grp:alt_shift_toggle

    follow_mouse = 1

    touchpad {
        tap-to-click = true
        tap-and-drag = true
        tap_button_map = lrm
        disable_while_typing = true
        drag_lock = false
        middle_button_emulation = true
    }
}

# --- Look ------------------------------------------------------------------

general {
    # theme:begin hypr-geometry
    gaps_in = 5
    gaps_out = 10
    border_size = 4
    # theme:end
    layout = dwindle
    # theme:begin hypr-border
    col.active_border = rgb(88c0d0)
    col.inactive_border = rgb(3b4252)
    # theme:end
}

decoration {
    # theme:begin hypr-rounding
    rounding = 5
    # theme:end

    blur {
        enabled = true
        size = 8
        passes = 1
        noise = 0.02
    }
}

# Tabbed containers. $mod+w groups the window with its neighbours and the
# groupbar is the row of tabs sway drew in its title bars.
group {
    # theme:begin hypr-group
    col.border_active = rgb(88c0d0)
    col.border_inactive = rgb(3b4252)
    # theme:end

    groupbar {
        # theme:begin hypr-groupbar-font
        font_family = JetBrainsMonoNL NF
        font_size = 14
        # theme:end
        # theme:begin hypr-groupbar
        col.active = rgb(88c0d0)
        col.inactive = rgb(7b88a1)
        # theme:end
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    # theme:begin hypr-background
    background_color = rgb(2e3440)
    # theme:end
}

animations {
    enabled = true
    animation = windows, 1, 1.5, default
    animation = fade, 1, 1.5, default
    animation = border, 1, 1.5, default
    # Workspace switches are instant, as they are under niri.
    animation = workspaces, 0
}

dwindle {
    preserve_split = true
}

# --- Window and workspace rules --------------------------------------------
#
# Since 0.56 a rule is written as properties first and the windows they apply to
# after, each one behind match:. class matches the Wayland app-id and the X11
# class alike, so the two lists the sway config keeps apart are one list here.

# sway's smart_gaps and smart_borders: a workspace holding one tiled window gets
# no gaps, no border and no rounding.
workspace = w[tv1], gapsout:0, gapsin:0
windowrule = border_size 0, rounding 0, match:float false, match:workspace w[tv1]

windowrule = workspace 1, match:class (?i)^slack$
windowrule = workspace 2, match:class (?i)^(code|code-oss|codium|vscodium)$
windowrule = workspace 3, match:class ^brave-browser$
windowrule = workspace 4, match:class ^Postman$
windowrule = workspace 6, match:class ^zoom$

windowrule = float true, size 1400 1000, center true, match:class ^(float_term|sticky_term)$
windowrule = pin true, match:class ^sticky_term$
windowrule = float true, size 1500 950, center true, match:class ^(content-search|file-search)$
windowrule = float true, size 1400 950, center true, pin true, match:class ^slight$
windowrule = float true, size 1800 900, center true, match:class ^system-monitor$
windowrule = float true, match:class ^(satty|feh|fzf-menu)$

# Meetings keep the screen awake and follow you between workspaces.
windowrule = idle_inhibit focus, pin true, match:title (?i).*meet.*

# --- Startup ---------------------------------------------------------------

exec-once = hyprpaper -c $dotfiles/config/hypr/hyprpaper.conf
# dbar speaks to niri and sway only; under Hyprland it exits at once and the bar
# stays empty until dbar grows a Hyprland backend. The line is here so that the
# day it does, nothing else has to change.
exec-once = dbar -c $dotfiles/config/dbar/config.toml
exec-once = xrdb -merge ~/.Xresources
exec-once = dunst -config $dotfiles/config/dunst/dunstrc > /dev/null
exec-once = $dotfiles/scripts/startup.sh > /dev/null
exec-once = foot --server
exec-once = kdeconnectd > /dev/null
exec-once = wl-paste --watch cliphist store --max-items=10000
exec-once = hypridle -c $dotfiles/config/hypr/hypridle.conf

# --- Bindings --------------------------------------------------------------

# Terminals
bind = $mod, Return, exec, footclient -T term
bind = $mod SHIFT, Return, exec, footclient -T term --app-id float_term
bind = $mod CTRL SHIFT, Return, exec, footclient --app-id sticky_term

# Displays. sway drove these through wlr-randr; a Hyprland monitor is put back
# by the next config reload, so it is moved through Hyprland itself instead.
bind = $mod, p, exec, hyprctl keyword monitor "eDP-1,1920x1200,0x0,1"
bind = $mod CTRL, p, exec, hyprctl keyword monitor "DP-1,preferred,1920x0,1"
bind = $mod SHIFT, p, exec, hyprctl keyword monitor "eDP-1,disable"
bind = $mod CTRL SHIFT, p, exec, hyprctl keyword monitor "DP-1,disable"

bind = $mod SHIFT, q, killactive,

# Launcher
bind = $mod, d, exec, $dotfiles/scripts/launcher.sh

# Focus
bind = $mod, j, movefocus, l
bind = $mod, k, movefocus, r
bind = $mod, Left, movefocus, l
bind = $mod, Down, movefocus, d
bind = $mod, Up, movefocus, u
bind = $mod, Right, movefocus, r

# Move
bind = $mod SHIFT, j, movewindow, l
bind = $mod SHIFT, k, movewindow, d
bind = $mod SHIFT, l, movewindow, u
bind = $mod SHIFT, semicolon, movewindow, r
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Down, movewindow, d
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# dwindle picks the split direction from the shape of the window, and only
# offers to flip it afterwards - there is no "the next window goes to the
# right" the way sway's split h and split v have. Both keys flip the active
# window's split, so either one still does what it did.
bind = $mod, h, layoutmsg, togglesplit
bind = $mod, v, layoutmsg, togglesplit

bind = $mod, f, fullscreen, 0
bind = $mod ALT, f, fullscreen, 1
bind = $mod, s, layoutmsg, togglesplit

# Tabs. sway's tabbed layout is a group here, so there is also a key to take a
# window back out of one.
bind = $mod, w, togglegroup,
bind = $mod SHIFT, w, moveoutofgroup,
bind = $mod, Tab, changegroupactive, f

bind = $mod, t, togglefloating,
# Hyprland has no single float/tile focus toggle: one key walks the floating
# windows and the other walks the tiled ones.
bind = $mod, space, cyclenext, floating
bind = $mod SHIFT, space, cyclenext, tiled

# No equivalent of sway's $mod+a: dwindle exposes no parent container to focus.

# Resize
bind = $mod, r, submap, resize
submap = resize
bind = , j, resizeactive, -10% 0
bind = , k, resizeactive, 0 10%
bind = , l, resizeactive, 0 -10%
bind = , semicolon, resizeactive, 10% 0
bind = , Left, resizeactive, 10% 0
bind = , Right, resizeactive, -10% 0
bind = , Up, resizeactive, 0 10%
bind = , Down, resizeactive, 0 -10%
bind = , Return, submap, reset
bind = , Escape, submap, reset
bind = $mod, r, submap, reset
submap = reset

# Gaps. Hyprland changes gaps only by being told a number, never by a step, so
# these are presets where sway had plus and minus.
bind = $mod SHIFT, g, submap, gaps
submap = gaps
bind = , 0, exec, hyprctl keyword general:gaps_in 0
bind = , 0, exec, hyprctl keyword general:gaps_out 0
bind = , 1, exec, hyprctl keyword general:gaps_in 5
bind = , 1, exec, hyprctl keyword general:gaps_out 10
bind = , 2, exec, hyprctl keyword general:gaps_in 10
bind = , 2, exec, hyprctl keyword general:gaps_out 20
bind = , 3, exec, hyprctl keyword general:gaps_in 20
bind = , 3, exec, hyprctl keyword general:gaps_out 40
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move the workspace to another output
bind = $mod, o, submap, move_workspace
submap = move_workspace
bind = , Left, movecurrentworkspacetomonitor, l
bind = , Right, movecurrentworkspacetomonitor, r
bind = , Up, movecurrentworkspacetomonitor, u
bind = , Down, movecurrentworkspacetomonitor, d
bind = , Escape, submap, reset
submap = reset

# Reload
bind = $mod SHIFT, r, exec, hyprctl reload

# Exit. sway asked through swaynag and niri draws its own dialog; Hyprland asks
# nothing and quits at once. The power menu on $mod+Escape has a logout tile
# that goes through the same dispatcher with a menu in front of it.
bind = $mod SHIFT, e, exit,

# Power menu (shared with sway, niri and i3)
bind = $mod, Escape, exec, $dotfiles/scripts/power.sh

# Scratchpad
bind = $mod SHIFT, m, movetoworkspacesilent, special:scratch
bind = $mod, m, togglespecialworkspace, scratch

# Focus urgent window
bind = $mod, x, focusurgentorlast,

# Brightness and audio. The l flag keeps them working over the lock screen.
bindl = , XF86MonBrightnessUp, exec, $dotfiles/scripts/brightness.sh up
bindl = , XF86MonBrightnessDown, exec, $dotfiles/scripts/brightness.sh down
bindl = SHIFT, XF86MonBrightnessUp, exec, ddcutil setvcp 10 + 5
bindl = SHIFT, XF86MonBrightnessDown, exec, ddcutil setvcp 10 - 5
bindl = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Tools
bind = $mod, e, exec, $dotfiles/scripts/emoji.sh
bind = $mod SHIFT, f, exec, footclient --app-id content-search sh -c "$dotfiles/scripts/content_search.sh"
bind = $mod CTRL, f, exec, footclient --app-id file-search sh -c "$dotfiles/bin/search"
bind = $mod, n, exec, footclient -w 1400x950 --app-id slight /home/dusan/.local/bin/slight
bind = $mod, b, exec, footclient --app-id system-monitor btop
bind = $mod SHIFT, c, exec, codium $dotfiles
bind = $mod, c, exec, $dotfiles/scripts/clipboard.sh
bind = $mod, g, exec, brave > /dev/null
bind = $mod SHIFT, s, exec, $dotfiles/scripts/screenshot.sh

# Notifications
bind = CTRL, space, exec, dunstctl close
bind = CTRL SHIFT, space, exec, dunstctl close-all
bind = ALT, grave, exec, dunstctl history-pop
bind = CTRL SHIFT, period, exec, dunstctl context

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
