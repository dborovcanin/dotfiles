# Idle handling for Hyprland, in place of the swayidle line the sway and niri
# configs carry. Read from the clone: hyprland.conf starts hypridle with -c
# pointing here.
#
# The timings are the ones the sway config has always used: lock at five
# minutes, screen off at ten.
#
# Locking goes through loginctl rather than straight to hyprlock, so that a lock
# asked for from anywhere else - the power menu, systemd before a suspend - ends
# up in the same place and only ever starts one locker.

general {
    lock_cmd = pidof hyprlock || hyprlock -c $HOME/dotfiles/config/hypr/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
