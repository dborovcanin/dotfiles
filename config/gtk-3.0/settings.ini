# Goes to ~/.config/gtk-3.0/settings.ini.
#
# Adwaita is the base for every GTK version here, with the dark variant selected
# by prefer-dark rather than by name: there is no theme called "Adwaita-dark" on
# disk, and naming one makes GTK fall back to the light default. The gruvbox
# colours are
# painted over it by gtk.css, which scripts/theme.sh writes. Keeping one base
# theme is what stops GTK 2, 3 and 4 from drifting apart again.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-font-name=Adwaita Sans 11
gtk-cursor-theme-name=BreezeX-Light
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
gtk-toolbar-style=GTK_TOOLBAR_BOTH
gtk-toolbar-icon-size=GTK_ICON_SIZE_LARGE_TOOLBAR
gtk-button-images=1
gtk-menu-images=1
gtk-enable-event-sounds=1
gtk-enable-input-feedback-sounds=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=none
