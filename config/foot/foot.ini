# theme:begin foot-font
font=JetBrainsMonoNL NF:size=14
# theme:end

[cursor]
style=beam
blink=yes

[scrollback]
lines=250000

[key-bindings]
show-urls-launch=Control+Shift+o

# foot picks between these two by what the desktop asks for; theme.sh writes the
# same colours into both, so the terminal does not change when the preference
# does. alpha rides along with them: it belongs to the same [colors] section.
[colors-dark]
# theme:begin foot-dark
foreground=eceff4
background=2e3440

regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4

selection-foreground=eceff4
selection-background=3b4252

urls=81a1c1

alpha=0.98
# theme:end

[colors-light]
# alpha=.9

# theme:begin foot-light
foreground=eceff4
background=2e3440

regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4

selection-foreground=eceff4
selection-background=3b4252

urls=81a1c1

alpha=0.98
# theme:end
