[preferred]
# niri implements Mutter's screencast D-Bus API for the gnome portal, which is
# what gives screen sharing its window and monitor picker. gtk covers whatever
# gnome does not. Needs xdg-desktop-portal-gnome.
default=gnome;gtk;
# gnome's own versions of these want gnome-shell to be running
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
